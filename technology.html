<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>technology</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    }
     body{
        font-family:arial,san-seif;
    background-color:#f4f4f4;
    border-bottom:1px solid#ddd;
    color:#333;
    line-height:1,6
     }
     header{
        font-size: 36px;
        margin-bottom: 5px;
     }
     naV{
        background-color: #e63946;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 25px;
        padding: 12px;
     }
     nav a{
        color: white;
        text-decoration: none;
        font-weight: bold;
     }
     nav a:hover{
        color: #ffd166;
     }
     main{
        max-width: 1100px;
        margin: 25px auto;
        padding: 0 20px;
     }
     .featured{
        background-color: white;
        margin-bottom: 35px;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px #00000015;
     }
     .featured img{
        width: 100%;
        height: 350px;
        object-fit: cover;
        display: block;
     }
     .featured-text{
        padding: 25px;
     }
     .featured-text h2{
        color: #14213d;
        margin-bottom:10px ;
     }
     .featured-text a,
     .news-card a{
        display: inline-block;
        color: #e63946;
        text-decoration: none;
        font-weight: bold;
        margin: 12px;
     }
   button{
    background:#2563eb;
    display: inline-block;
    border-radius: 6px;
    color:white;
    text-decoration:none;
    height: 25px;
    width: 40px;
   }
   button a{
    text-decoration: none;
    color: white;
   }
   button:hover{
    background: #1d4ed8;
     .latest-news a:hover,
     .nwe-card a:hover{
        text-decoration: none;
     }
     }
     .latest-news h2{
        margin-bottom: 20px;
        color: #14213d;
     }
     .new container{
        display: grid;
        grid-template-columns: repeat(3,1fr);
        gap: 20px;
     }
     .news-card{
        background-color: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px #00000015;
        transition: 0.3s;
     }
     .news-card hover{
        transform: rotateY(-5px);
     }
     .new-card img{
        width: 100%;
        height: 180px;
        object-fit: cover;
        display: block;
     }
     .card-content span{
        color: #e63946;
        font-size: 13px;
        font-weight: bold;
        text-transform: uppercase;
     }
     .card-content h3{
        margin: 8px 0;
        color: #14213d;
     }
     footer{
        background-color: #14213d;
        color: white;
        text-align: center;
        padding: 20px;
        margin-top: 40px;
     }
     @media(max-width:768){
        .news-container{
            grid-template-columns: 1fr;
        }
        .featured img{
            height: 220px;
        }
        header h1{
            font-size: 28px;
        }
        nav{
            gap: 15px;
        }
     } 
    </style>
</head>
<body>
    <button><a href="index.html">home</a></button>
    <main>
       <section class="featured">
            <img src="OIP (3).webp" alt="featured news">
            <div class="featured-text">
               <h3>New technology changes the future</h3>
                        <p>Discover how innovation is changing the way people live and work</p>
                <a href="read more">read more</a>
            </div>
        </section>
    </main>
    <br>

            <div class="featured-text">
             <h3>New technology changes the future</h3>
                        <p>Discover how innovation is changing the way people live and work</p>
                <a href="read more">read more</a>
            </div>
        </section>
    </main>
</body>
</html>
